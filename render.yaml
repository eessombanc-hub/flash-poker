## Espace de test Render.com — Flash Poker
#
# Un seul service web (plan gratuit) sert à la fois l'API, le WebSocket (Socket.IO) et l'interface
# compilée : même origine, aucune configuration CORS à faire. Voir les limites du plan gratuit dans
# README.md ("Décisions techniques" / déploiement), notamment :
#   - le service s'endort après 15 minutes d'inactivité (reprise en 30 à 60 s au réveil) ;
#   - le disque est ÉPHÉMÈRE : la base SQLite (dossier `data/`) est effacée à chaque redéploiement,
#     redémarrage ou mise en veille. Convient à un essai, pas à une mise en production (prévue sur le
#     VPS OVH, avec un disque persistant).
#
# Déploiement : créer un compte Render, "New +" → "Blueprint", connecter ce dépôt Git. Render lit ce
# fichier automatiquement et propose le service ci-dessous.

services:
  - type: web
    name: flash-poker
    runtime: node
    plan: free
    region: frankfurt # le plus proche d'un usage en France ; changer si les joueurs sont ailleurs
    buildCommand: npm install && npm run build:web
    startCommand: npm -w @poker/server run start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0 # node:sqlite (sauvegarde des parties) : disponible sans option à partir de cette version
      - key: WEB_DIST
        value: ../web/dist # construit par buildCommand ; servi par ce même service (même origine)
      - key: DB_PATH
        value: ./data/flashpoker.db # perdu à chaque redémarrage sur le plan gratuit (disque éphémère)
      # Comptes joueurs : base « comptes.db » à côté de DB_PATH (même limite : effacée à chaque redéploiement
      # sur le plan gratuit). E-mails (mot de passe oublié, favori connecté) : valeurs à saisir dans Render,
      # onglet Environment, jamais écrites ici. Sans SMTP_HOST, aucun e-mail ne part et la récupération du
      # mot de passe est signalée indisponible dans l'application.
      # Nombre de relais de confiance devant le serveur (adresse IP réelle des joueurs pour les limites de débit).
      # Valeur 1 par défaut sur Render. Vérification : DEBUG_IP=1 puis /_ip (voir README, section Sécurité).
      - key: TRUST_PROXY
        value: "1"
      # Plan gratuit : Render bloque les ports SMTP, utilisez l'API HTTPS de Brevo (BREVO_API_KEY + MAIL_FROM).
      - key: BREVO_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Sauvegarde gratuite et chiffrée des comptes dans un dépôt GitHub privé (voir SAUVEGARDE_GRATUITE.md).
      - key: BACKUP_GITHUB_REPO
        sync: false
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_PASSPHRASE
        sync: false
    # PORT et HOST : Render les fournit déjà (PORT=10000, écoute sur 0.0.0.0) ; main.ts les lit tels quels.
    healthCheckPath: /health
    autoDeployTrigger: commit # redéploie automatiquement à chaque push sur la branche connectée
